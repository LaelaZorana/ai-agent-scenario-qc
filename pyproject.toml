[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-scenario-qc"
dynamic = ["version"]
description = "Quality control for AI agent training scenarios: schema + semantic checks, a weighted rubric score, and a severity-tagged defect log."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Laela Zorana", email = "zoranalaela9@gmail.com" }]
keywords = [
    "ai-agents",
    "agent-evaluation",
    "quality-control",
    "scenario-validation",
    "json-schema",
    "rubric-scoring",
    "llm-evaluation",
    "data-quality",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["jsonschema>=4.20.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
demo = ["gradio>=4.0"]

[project.urls]
Homepage = "https://github.com/LaelaZorana/ai-agent-scenario-qc"
Repository = "https://github.com/LaelaZorana/ai-agent-scenario-qc"
"Live demo" = "https://huggingface.co/spaces/LaelaZ/ai-agent-scenario-qc"
Changelog = "https://github.com/LaelaZorana/ai-agent-scenario-qc/blob/main/CHANGELOG.md"

[project.scripts]
scenario-qc = "qc_reviewer.__main__:main"

[tool.setuptools]
packages = ["qc_reviewer"]

[tool.setuptools.package-data]
qc_reviewer = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "qc_reviewer.__version__" }
